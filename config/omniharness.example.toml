# OmniHarness example configuration.
#
# Copy this file to ~/.omniharness.toml and edit. Every value here is also
# the default, so a config file is optional — OmniHarness runs on defaults
# plus environment overrides.
#
# OmniRoute connection:
#   - endpoint: base URL of the OmniRoute HTTP API (default http://127.0.0.1:20128)
#   - timeout:  per-request bound for a single model call
#   - api_key:  OPTIONAL. Prefer the environment variable instead — a key
#               written here sits in plaintext on disk. The recommended way:
#
#                   export OMNIROUTE_URL=http://127.0.0.1:20128
#                   export OMNIROUTE_API_KEY=sk-…    # OmniRoute API key
#                   export OMNIROUTE_MGMT_TOKEN=sk-… # management token (manage scope): enables MCP tool discovery
#
#   OmniHarness authenticates to OmniRoute with `Authorization: Bearer <key>`
#   on every request (verified against the OmniRoute server source). The key
#   is never printed, logged, or persisted; `omniharness doctor` shows only
#   its last 4 characters (key_<last4>) and the auth verdict.

[omniroute]
endpoint = "http://127.0.0.1:20128"
timeout = "120s"
# api_key = ""   # prefer OMNIROUTE_API_KEY

# The model combo the harness routes through. "auto/*" combos route to
# whatever provider is actually provisioned, so they work on any instance;
# explicit provider-pinned ids (e.g. openai/gpt-5.4) only work when that
# provider is configured+funded. Choose interactively with `omniharness stack`
# (or the TUI combo picker, p key).
[models]
default = "auto/best-coding"

[models.capabilities]
reasoning = "auto/best-reasoning"
fast = "auto/best-fast"
cheap = ""
long-context = ""
coding = "auto/best-coding"
vision = ""
research = ""
review = ""

# 0 means no limit. max_cost_usd ships with a real ceiling rather than 0
# because this harness spends money without asking between turns: hitting the
# limit stops the run and says so, which is a better way to find a runaway
# loop than the bill. Raise it for long tasks, or per run with --max-cost.
[budgets]
max_tokens = 0
max_cost_usd = 5.00
max_duration = "0s"
max_agents = 4
max_tool_calls = 0
max_repair_cycles = 3

[policy]
shell_allowed = false
git_push_requires_approval = true
# workspace_root confines filesystem tools, and scopes the verification pass,
# to this directory tree. Unset it defaults to the current working directory.
# Override per run with --workspace or OMNIHARNESS_WORKSPACE.
# workspace_root = "/path/to/project"

# Every subprocess is spawned without the harness's own credentials
# (OMNIROUTE_API_KEY and friends). Everything else is inherited, because an
# agent running `gh pr create` or `npm publish` needs those tools' tokens.
# secret_env names more variables to strip; wildcards allowed, case-insensitive.
# secret_env = ["GITHUB_TOKEN", "AWS_*", "*_TOKEN"]

# allow runs it, ask prompts for approval, block refuses.
# critical is the exception: it refuses either way. Setting it to "ask"
# does not make critical tools promptable.
[policy.risk_action]
low = "allow"
medium = "allow"
high = "ask"
critical = "block"

[persistence]
dir = "~/.omniharness"

[telemetry]
enabled = true
retention_days = 90

[tui]
color = true
refresh_ms = 100

[logging]
level = "info"
format = "text"

# deep_analysis turns on an optional model call, made after the free
# heuristic task analysis and only for tasks its own signals already flag as
# non-trivial, that produces concrete acceptance criteria grounded in the
# actual request. It spends real tokens on top of the task's own work, so it
# defaults off.
[task]
deep_analysis = false

# MCP servers become tool providers. Each server's tools register into the
# same registry as the native tools, so policy applies to them identically.
#
# capabilities declares what the server's tools provide. MCP has no capability
# field of its own — the protocol reports names, descriptions and input
# schemas only — so this is your declaration and cannot be discovered. It is
# how agents reach the server: roles select tools by capability, not by name,
# and a server's tool names are only known at runtime.
#
# The vocabulary is open. Names must be lowercase letters, digits and
# underscores; nothing checks them against a fixed list, so a capability this
# build has never heard of is fine. A typo is rejected at startup rather than
# leaving the server loaded but unreachable.
#
# capabilities are for DISCOVERY, not access. Every MCP tool also carries
# "external_tool", which is what the acting roles (implementer, researcher,
# debugger, tester, optimizer) match on; the read-only roles (reviewer,
# security auditor, architect, synthesizer) get neither. So declaring names
# never changes who can reach the server — describing it better must not make
# it less usable. To restrict a server, use policy.blocked_tools /
# policy.allowed_tools and the risk_action table, which is the layer that
# exists for that.
#
# tool_capabilities declares capabilities per tool, keyed by the name the
# server reports. A server rarely has one job: blender-mcp exposes 28 tools
# spanning scene inspection, rendering, telemetry and third-party asset search,
# and a single server-level list gives every one of them every capability, so
# "what can render a scene?" answers "all 28". Name the tools that matter and
# let the rest fall back to the server list.
#
# Example: Blender, via github.com/ahujasid/blender-mcp (verified against
# v1.9.1 / server 1.29.1 — 28 tools, tool names below are the real ones).
# Running it needs Blender itself with that project's addon started; the
# harness needs no code either way.
#
# [[mcp.servers]]
# name = "blender"
# command = "uvx"
# args = ["blender-mcp"]
# capabilities = ["execute_code"]
#
# [mcp.servers.tool_capabilities]
# get_scene_info                  = ["inspect_3d_scene"]
# get_object_info                 = ["inspect_3d_scene"]
# get_viewport_screenshot         = ["inspect_3d_scene", "render_scene"]
# execute_blender_code            = ["modify_3d_scene", "execute_code"]
# set_texture                     = ["modify_3d_scene"]
# generate_hyper3d_model_via_text = ["generate_3d_asset"]

# Binary tool output (a viewport screenshot, a rendered frame) is written to
# <workspace>/.omniharness/artifacts and referenced by path in the tool result.
# The tool-result channel is text, so an image cannot ride in one; it arrives
# as a following user message instead.
#
# [models.supports] declares what each model can actually do, keyed by
# provider/model. Known properties: vision, tools, structured_output,
# long_context, local. It has to be declared — OmniRoute's catalog reports id,
# name and provider with nothing about modality or context — so the harness
# will not guess, and an undeclared model is treated as supporting nothing.
#
# Note the direction, which is the opposite of [models.capabilities] above.
# capabilities maps a capability to a model ("for reasoning, use X");
# supports maps a model to facts ("X can see"). Both are needed: a run can be
# on a coding model and still need to know whether that model takes an image.
#
# Latency and cost are deliberately not declared here. Performance memory
# measures them from real runs, which beats an estimate and cannot go stale.
#
# When a tool returns an image and the run's own model is not declared to see,
# that one turn is routed to a model that is, and the run continues on its own
# model afterwards. With nothing declared no image is ever sent, and the agent
# is told in text that one exists which it cannot view.
#
# [models.supports]
# "antigravity/gemini-3.6-flash-high" = ["vision", "tools"]
# "openai/gpt-5" = ["vision", "tools", "long_context"]

# tool_effects declares consequences per tool, which the risk class does not
# capture: destructive (cannot be undone), financial (spends money),
# credential (handles secrets), requires_confirmation (ask anyway), read_only,
# external. The first four force a confirmation prompt however permissive
# [policy.risk_action] is — setting high = "allow" to stop being asked about
# shell is not agreement to spend money unprompted.
#
# Real example: blender-mcp's asset generation and download tools bill
# third-party APIs, and nothing about their risk class says so.
#
# [mcp.servers.tool_effects]
# generate_hyper3d_model_via_text = ["financial", "external"]
# download_sketchfab_model        = ["financial", "external"]
# get_scene_info                  = ["read_only"]
