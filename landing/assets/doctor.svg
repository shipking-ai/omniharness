<text class="r r6" x="26" y="188"><tspan fill="#8fd66f">ok</tspan><tspan fill="#6f7889">   runtime                      wired</tspan></text>
<text class="r r7" x="26" y="209"><tspan fill="#8fd66f">ok</tspan><tspan fill="#6f7889">   omniroute endpoint           http://127.0.0.1:20128 reachable (HTTP 200)</tspan></text>
<text class="r r8" x="26" y="230"><tspan fill="#8fd66f">ok</tspan><tspan fill="#6f7889">   omniroute auth               authenticated [key_9999] (reachable and authenticated)</tspan></text>
