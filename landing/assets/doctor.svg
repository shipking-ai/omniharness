<text class="r r10" x="26" y="272"><tspan fill="#8fd66f">ok</tspan><tspan fill="#6f7889">   store                        24 sessions, 22 tasks, 170 model calls</tspan></text>
<text class="r r11" x="26" y="293"><tspan fill="#8fd66f">ok</tspan><tspan fill="#6f7889">   version                      omniharness 0.1.112 (b688a58)</tspan></text>
<text class="r r12" x="26" y="314"></text>
<text class="r r13" x="26" y="335"><tspan fill="#e6e9f0">11 of 11 checks passed</tspan></text>
<rect class="cursor" x="26" y="352" width="8" height="15" fill="#2dd4bf" opacity="0.9"/>
</svg>
