<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omniharness</title>
<!-- Everything is served from the binary: no CDN, no webfont, no analytics.
     A harness you can run on a plane should not need the internet to draw
     itself. The type stack below is entirely system fonts for that reason. -->
<style>
  :root{
    /* Surfaces climb in four steps rather than two, which is what lets a card
       sit on a panel sit on the ground without a border doing all the work. */
    --ground:#0b0d12;
    --s1:#101319;
    --s2:#151922;
    --s3:#1c212c;
    --line:#232936;
    --line-soft:#1a1f29;

    --ink:#e6e9f0;
    --ink-2:#a8b0c0;
    --ink-3:#6f7889;

    --accent:#2dd4bf;
    --accent-dim:#1c8a7d;
    --info:#56b6ff;
    --success:#8fd66f;
    --warn:#e6b955;
    --error:#f2637e;

    /* UI in a system sans, code in a system mono. Setting an entire interface
       in monospace is the loudest tell that nobody designed it: it flattens
       every level of hierarchy into one texture. */
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI Variable Text','Segoe UI',
           Inter,Roboto,'Helvetica Neue',Arial,sans-serif;
    --mono:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono',Menlo,Consolas,monospace;

    --r-sm:6px; --r:10px; --r-lg:14px;
    /* One shadow scale. Depth is what separates a card from a coloured box. */
    --sh-1:0 1px 2px rgba(0,0,0,.4);
    --sh-2:0 4px 16px -4px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.3);
    --sh-3:0 18px 48px -12px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.4);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* A class that sets display beats the user agent's [hidden] rule on
     specificity, so .empty{display:flex} kept the hidden empty state in
     the layout and pushed the transcript down the page. */
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    background:var(--ground); color:var(--ink);
    font-family:var(--sans); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  ::selection{background:rgba(45,212,191,.28)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--s3);border-radius:99px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--line);background-clip:content-box}

  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
  /* The scene is ambience, not wallpaper: present at the top where the shell is
     thin, near-solid behind the reading column. */
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 80% at 70% -10%, rgba(11,13,18,.20) 0%, rgba(11,13,18,.78) 45%, rgba(11,13,18,.94) 100%)}

  .app{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:248px minmax(0,1fr)}
  @media (max-width:860px){ .app{grid-template-columns:1fr} .rail{display:none} }

  /* ── Left rail ─────────────────────────────────────────────── */
  .rail{
    border-right:1px solid var(--line-soft); background:rgba(16,19,25,.72);
    backdrop-filter:blur(20px) saturate(120%);
    display:flex;flex-direction:column;padding:18px 14px;gap:18px;min-height:0;
  }
  .brand{display:flex;align-items:center;gap:9px;padding:2px 6px 0}
  .brand-name{font-weight:650;letter-spacing:-.015em;font-size:15px}
  .brand-name .a{color:var(--accent)}
  .brand-ver{font-size:11px;color:var(--ink-3);font-family:var(--mono)}

  .new-run{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:9px 12px;border-radius:var(--r);cursor:pointer;
    background:var(--s3);color:var(--ink);border:1px solid var(--line);
    font:inherit;font-weight:550;box-shadow:var(--sh-1);
    transition:background .15s ease,border-color .15s ease,transform .1s ease;
  }
  .new-run:hover{background:#222836;border-color:#2d3444}
  .new-run:active{transform:translateY(1px)}

  .rail-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:0 6px}
  .sessions{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:2px;margin-top:-8px}
  .session{
    display:block;width:100%;text-align:left;border:0;background:transparent;
    color:var(--ink-2);font:inherit;font-size:13px;padding:7px 10px;border-radius:var(--r-sm);
    cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:background .12s ease,color .12s ease;
  }
  .session:hover{background:var(--s2);color:var(--ink)}
  .session.active{background:var(--s3);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
  .sessions-empty{font-size:12.5px;color:var(--ink-3);padding:4px 10px}

  .rail-foot{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line-soft);padding-top:14px}
  .stat{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:0 6px}
  .stat-k{color:var(--ink-3)}
  .stat-v{color:var(--ink-2);font-family:var(--mono);font-size:11.5px}
  .dot{width:6px;height:6px;border-radius:99px;display:inline-block;margin-right:7px;vertical-align:1px}
  .dot.ok{background:var(--success)}
  .dot.bad{background:var(--error)}
  .dot.idle{background:var(--ink-3)}

  /* ── Main column ───────────────────────────────────────────── */
  .main{display:flex;flex-direction:column;min-height:0;min-width:0}
  .topbar{display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--line-soft)}
  .run-title{font-weight:600;font-size:14.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .run-sub{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
  .spacer{flex:1}
  .chip{
    display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:550;
    padding:5px 11px;border-radius:99px;border:1px solid var(--line);
    background:var(--s2);color:var(--ink-2);white-space:nowrap;
  }
  .chip.busy{color:var(--warn);border-color:rgba(230,185,85,.3);background:rgba(230,185,85,.08)}
  .chip.ok{color:var(--success);border-color:rgba(143,214,111,.3);background:rgba(143,214,111,.08)}
  .chip.bad{color:var(--error);border-color:rgba(242,99,126,.3);background:rgba(242,99,126,.08)}
  .chip-mark{font-family:var(--mono);font-size:11px;font-weight:600}

  .ghost{
    font:inherit;font-size:13px;cursor:pointer;padding:6px 13px;border-radius:var(--r-sm);
    background:transparent;color:var(--ink-2);border:1px solid var(--line);
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .ghost:hover{background:var(--s2);color:var(--ink)}
  .ghost.danger:hover{color:var(--error);border-color:rgba(242,99,126,.45);background:rgba(242,99,126,.08)}

  .scroll{flex:1;overflow-y:auto;min-height:0;padding:22px 26px 8px}
  .stream{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:1px}

  /* An event row: time, a fixed status cell, the type, then the detail. The
     status words are the TUI's own — ok / FAIL / .. / - / > — so someone who
     knows one front-end can read the other. */
  .ev{
    display:grid;grid-template-columns:60px 42px 176px minmax(0,1fr);gap:12px;align-items:baseline;
    padding:5px 10px;border-radius:var(--r-sm);
  }
  .ev:hover{background:rgba(28,33,44,.5)}
  .ev-t{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .ev-m{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
  .ev.ok .ev-m{color:var(--success)}
  .ev.bad .ev-m{color:var(--error)}
  .ev.warn .ev-m{color:var(--warn)}
  .ev.busy .ev-m{color:var(--info)}
  .ev-k{font-family:var(--mono);font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev-d{font-size:13.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ── Empty state ───────────────────────────────────────────── */
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding-bottom:8vh}
  .empty p{color:var(--ink-3);font-size:13px;max-width:52ch}

  /* ── Composer ──────────────────────────────────────────────── */
  .composer{padding:12px 26px 20px}
  .composer-inner{max-width:900px;margin:0 auto}
  .box{
    display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 14px;
    background:rgba(21,25,34,.9);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--sh-2);
    transition:border-color .18s ease,box-shadow .18s ease;
  }
  .box:focus-within{border-color:var(--accent-dim);box-shadow:var(--sh-2),0 0 0 3px rgba(45,212,191,.12)}
  textarea{
    flex:1;resize:none;background:transparent;color:var(--ink);border:0;outline:none;
    font:inherit;font-size:14px;line-height:1.55;max-height:180px;min-height:24px;padding:5px 0;
  }
  textarea::placeholder{color:var(--ink-3)}
  .send{
    flex:none;width:34px;height:34px;border-radius:9px;border:0;cursor:pointer;
    background:var(--accent);color:#04231f;display:grid;place-items:center;
    box-shadow:0 4px 14px -4px rgba(45,212,191,.6);
    transition:filter .15s ease,transform .1s ease,opacity .15s ease;
  }
  .send:hover{filter:brightness(1.08)}
  .send:active{transform:translateY(1px)}
  .send:disabled{opacity:.35;cursor:default;box-shadow:none;filter:none}
  .under{display:flex;justify-content:space-between;gap:12px;margin-top:9px;padding:0 4px}
  .under small{font-size:11.5px;color:var(--ink-3)}
  kbd{
    font-family:var(--mono);font-size:10.5px;background:var(--s2);color:var(--ink-2);
    border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;
  }
  .gap-note{color:var(--warn)}

  /* ── Approvals ─────────────────────────────────────────────── */
  .approvals{position:fixed;right:24px;bottom:118px;z-index:20;display:flex;flex-direction:column;gap:10px;width:min(380px,calc(100vw - 48px))}
  .approval{
    background:rgba(28,33,44,.97);border:1px solid rgba(230,185,85,.4);
    border-radius:var(--r-lg);padding:15px 16px;box-shadow:var(--sh-3);
  }
  .approval-top{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .approval-tool{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--warn)}
  .approval-risk{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
  .approval-why{font-size:13px;color:var(--ink-2);margin-bottom:13px;line-height:1.45}
  .approval-actions{display:flex;gap:8px}
  .approval-actions button{flex:1;padding:8px 12px;border-radius:var(--r-sm);font:inherit;font-size:13px;font-weight:550;cursor:pointer;transition:filter .15s ease}
  .deny{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
  .deny:hover{color:var(--error);border-color:rgba(242,99,126,.45)}
  .grant{background:var(--success);color:#0b2408;border:0}
  .grant:hover{filter:brightness(1.06)}

  /* Someone who has asked not to see motion should not have to watch a graph
     spin, a row slide in, or a dot breathe. */
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="veil"></div>

<div class="app">
  <nav class="rail">
    <div class="brand">
      <div>
        <div class="brand-name"><span class="a">omni</span>harness</div>
        <div class="brand-ver" id="version">&nbsp;</div>
      </div>
    </div>

    <button class="new-run" id="new-run">new run</button>

    <div class="rail-label">sessions</div>
    <div class="sessions" id="sessions"><div class="sessions-empty">none yet</div></div>

    <div class="rail-foot">
      <div class="stat"><span class="stat-k"><span class="dot idle" id="gw-dot"></span>gateway</span><span class="stat-v" id="gw">checking</span></div>
      <div class="stat"><span class="stat-k">stream</span><span class="stat-v" id="link">connecting</span></div>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <div style="min-width:0">
        <div class="run-title" id="run-title">idle</div>
        <div class="run-sub" id="run-sub">nothing running</div>
      </div>
      <span class="spacer"></span>
      <span class="chip" id="chip">idle</span>
      <button class="ghost danger" id="cancel" hidden>cancel</button>
    </div>

    <div class="scroll" id="scroll">
      <div class="empty" id="empty">
        <p>every model call, tool call and approval appears here as it happens</p>
      </div>
      <div class="stream" id="stream" hidden></div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <div class="box">
          <textarea id="prompt" rows="1" placeholder="describe the work" spellcheck="false"></textarea>
          <button class="send" id="go" title="Run" aria-label="Run">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div class="under">
          <small><kbd>enter</kbd> runs · <kbd>shift</kbd>+<kbd>enter</kbd> for a newline</small>
          <small id="gaps" class="gap-note" hidden></small>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="approvals" id="approvals"></div>

<script src="/app.js"></script>
</body>
</html>
