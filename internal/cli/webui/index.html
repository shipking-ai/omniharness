<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omniharness</title>
<!-- Everything is served from the binary, so nothing here reaches the network:
     no CDN, no webfont, no analytics. A harness you can run on a plane should
     not have a UI that needs the internet to draw itself. -->
<style>
  :root{
    /* The landing page's tokens, so the two surfaces are recognisably one
       product. Kept in sync by hand; there are five of them. */
    --ground:#0e1016; --surface:#14171f; --raised:#1a1e28; --hairline:#262b38;
    --ink:#c8cdd9; --muted:#8b93a7;
    --accent:#2dd4bf; --info:#56b6ff; --success:#8fd66f; --warn:#e6b955; --error:#f2637e;
    --mono:ui-monospace,'JetBrains Mono','Cascadia Mono','Fira Code',Menlo,Consolas,monospace;
    --radius:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--ground); color:var(--ink); font-family:var(--mono);
    font-size:13px; line-height:1.55; overflow:hidden;
  }
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
  /* Just enough wash to keep text legible over a moving scene. It was heavy
     enough to bury the graph entirely at first — the point of the background is
     that you can see it. */
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:
    radial-gradient(130% 100% at 50% 0%, rgba(14,16,22,.10) 0%, rgba(14,16,22,.38) 55%, rgba(14,16,22,.62) 100%)}
  .app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}

  header{
    display:flex;align-items:center;gap:14px;
    padding:14px 20px;border-bottom:1px solid var(--hairline);
    background:rgba(14,16,22,.52);backdrop-filter:blur(14px);
  }
  .wordmark{font-weight:700;letter-spacing:-.01em}
  .wordmark .a{color:var(--accent)}
  .grow{flex:1}
  .pill{
    font-size:11px;letter-spacing:.05em;color:var(--muted);
    border:1px solid var(--hairline);border-radius:999px;padding:3px 11px;
  }
  .pill.ok{color:var(--success);border-color:rgba(143,214,111,.35)}
  .pill.bad{color:var(--error);border-color:rgba(242,99,126,.35)}
  #version,#link{font-size:11px;color:var(--muted)}

  main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:1px;min-height:0;background:rgba(38,43,56,.5)}
  @media (max-width:900px){ main{grid-template-columns:1fr} aside{display:none} }
  .panel{background:rgba(20,23,31,.30);backdrop-filter:blur(14px);min-height:0;display:flex;flex-direction:column}

  #stream{flex:1;overflow-y:auto;padding:16px 20px;min-height:0}
  .row{display:grid;grid-template-columns:34px 168px minmax(0,1fr);gap:10px;padding:2px 0}
  .row .mark{color:var(--muted)}
  .row.error .mark{color:var(--error)}
  .row.warn .mark{color:var(--warn)}
  .row .etype{color:var(--muted)}
  .row .etext{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #stream:empty::after{
    content:'no run yet — describe the work below';color:var(--muted);
  }

  .composer{border-top:1px solid var(--hairline);padding:14px 20px;background:rgba(14,16,22,.5)}
  .composer-row{display:flex;gap:10px;align-items:flex-end}
  textarea{
    flex:1;resize:none;height:66px;background:rgba(20,23,31,.72);color:var(--ink);
    border:1px solid var(--hairline);border-radius:var(--radius);
    padding:10px 12px;font:inherit;outline:none;
  }
  textarea:focus{border-color:var(--accent)}
  .btn{
    font:inherit;cursor:pointer;border-radius:var(--radius);padding:10px 18px;
    background:var(--raised);color:var(--ink);border:1px solid var(--hairline);
  }
  .btn:hover{border-color:var(--muted)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.primary{background:var(--accent);color:#06231f;border-color:var(--accent);font-weight:600}
  .btn.grant{background:var(--success);color:#0d2408;border-color:var(--success);font-weight:600}
  .btn.deny{color:var(--error);border-color:rgba(242,99,126,.4)}
  .hint{margin-top:8px;font-size:11px;color:var(--muted)}
  #gaps{margin-top:8px;font-size:11px;color:var(--warn)}

  aside{padding:16px 18px;overflow-y:auto;gap:18px;display:flex;flex-direction:column}
  h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .status{margin-top:6px;font-size:20px}
  .status.busy{color:var(--warn)}
  .status.ok{color:var(--success)}
  .status.bad{color:var(--error)}

  .approval{
    border:1px solid rgba(230,185,85,.45);border-radius:var(--radius);
    background:rgba(26,30,40,.9);padding:12px;margin-top:10px;
  }
  .approval-head{color:var(--warn);font-weight:600}
  .approval-why{color:var(--muted);margin:6px 0 12px;font-size:12px}
  .approval-actions{display:flex;gap:8px}
  .approval-actions .btn{flex:1;padding:8px 10px;text-align:center}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="veil"></div>

<div class="app">
  <header>
    <span class="wordmark"><span class="a">omni</span>harness</span>
    <span id="version"></span>
    <span class="grow"></span>
    <span id="link">connecting</span>
    <span id="gateway" class="pill">gateway</span>
  </header>

  <main>
    <section class="panel">
      <div id="stream"></div>
      <div class="composer">
        <div class="composer-row">
          <textarea id="prompt" placeholder="describe the work" spellcheck="false"></textarea>
          <button id="go" class="btn primary">run</button>
          <button id="cancel" class="btn deny" hidden>cancel</button>
        </div>
        <div class="hint">enter runs · shift+enter for a newline · approvals appear on the right</div>
        <div id="gaps" hidden></div>
      </div>
    </section>

    <aside class="panel">
      <div>
        <h2>run</h2>
        <div id="status" class="status">idle</div>
      </div>
      <div id="approval-wrap" hidden>
        <h2>waiting on you</h2>
        <div id="approvals"></div>
      </div>
    </aside>
  </main>
</div>

<script src="/app.js"></script>
</body>
</html>
